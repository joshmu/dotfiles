- defaults:
      link:
          relink: true

- clean: ["~"]

- link:
      # ~/.vimrc: vimrc
      ~/.zshenv: .zshenv
      ~/.zshrc: .zshrc
      ~/.zprofile: .zprofile
      ~/.aliases: .aliases
      ~/completion-for-pnpm.zsh: completion-for-pnpm.zsh
      ~/.tmux.conf: tmux.conf
      ~/.config/nvim: nvim
      ~/.config/iterm2: # ~/Library/Preferences/com.googlecode.iterm2.plist: iterm2/com.googlecode.iterm2.plist
      ~/vscode-custom: vscode-custom
      ~/.config/kitty/kitty.conf: kitty/kitty.conf
      ~/.config/kitty/current-theme.conf: kitty/current-theme.conf
      ~/.config/ghostty/config: ghostty
      ~/Library/Application Support/com.mitchellh.ghostty/config: ghostty
      ~/.config/karabiner:
      ~/.gitconfig:
      ~/.actrc: actrc
      ~/.bashrc: .bashrc
      ~/.bash_profile: .bash_profile
      ~/.hushlogin: .hushlogin
      ~/.p10k.zsh: zsh/p10k.zsh
      ~/.hyper.js: hyper.js
      ~/.oh-my-mu.json: oh-my-mu.json
      ~/Library/Application Support/lazygit/config.yml: lazygit-config.yml
      ~/Library/Application Support/lazydocker/config.yml: lazydocker-config.yml
      ~/.config/gh-dash/config.yml: gh-dash-config.yml
      ~/vault/.obsidian/snippets: obsidian/snippets
      ~/vault/.obsidian.vimrc: obsidian/obsidian.vimrc
      # Editor configs link only where the app is installed: VS Code on the work Mac,
      # Cursor on the personal Mac (see docs/editor-setup.md).
      ~/.cursor/mcp.json:
          path: cursor/mcp.json
          if: '[ -d /Applications/Cursor.app ]'
      ~/Library/Application Support/Cursor/User/keybindings.json:
          path: cursor/keybindings.json
          if: '[ -d /Applications/Cursor.app ]'
      ~/Library/Application Support/Code/User/keybindings.json:
          path: vscode/keybindings.json
          if: '[ -d "/Applications/Visual Studio Code.app" ]'
      ~/Library/Application Support/Claude/claude_desktop_config.json: claude_desktop_config.json
      ~/scripts: scripts
      ~/.config/opencode/opencode.json: opencode/opencode.json
      ~/.config/caveman/config.json: caveman/config.json
      ~/.config/herdr/config.toml: herdr/config.toml
      # ~/Library/Mobile Documents/iCloud~md~obsidian/Documents/obsidian/.obsidian.vimrc: obsidian.vimrc

- create:
      - ~/downloads
      - ~/.vim/undo-history
      - ~/.config/gh-dash
      - ~/.config/caveman
      - ~/.config/herdr

- shell:
      - [git submodule update --init --recursive, Installing submodules]
